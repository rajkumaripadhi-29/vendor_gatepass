

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tata Steel Special Economic Zone – Gate Pass System. Secure login portal for managing industrial gate passes at Gopalpur Industrial Park." />
  <title>Login – Tata Steel SEZ Gate Pass System</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="login.css" />

  <!-- Favicon (Tata Blue placeholder) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23003366'/><text x='50' y='62' font-family='Arial' font-weight='bold' font-size='28' fill='white' text-anchor='middle'>TATA</text></svg>" />
</head>

<body>
  <!-- ============================================================
       NAVBAR
       ============================================================ -->
  <nav class="navbar" id="navbar">
    <div class="navbar-brand">
      <!-- Tata Logo SVG -->
     <img 
  src="https://www.carlogos.org/logo/Tata-Group-logo-3840x2160.png"
  alt="Tata Logo"
  class="navbar-logo"
/>
      <span class="navbar-title">Tata Steel Special Economic Zone</span>
    </div>
  </nav>

  <!-- ============================================================
       BACKGROUND
       ============================================================ -->
  <!-- Background image of Gopalpur Industrial Park -->
  <div class="login-bg">
    <img src="bg-industrial.webp" alt="Gopalpur Industrial Park – Tata Steel SEZ" />
  </div>
  <!-- Dark gradient overlay for better text visibility -->
  <div class="login-overlay"></div>

  <!-- Decorative floating particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- ============================================================
       LOGIN SECTION
       ============================================================ -->
  <main class="login-wrapper">
    <div class="login-card" id="loginCard">
      <!-- Card Header -->
      <div class="login-card-header">
        <div class="login-card-icon">
          <!-- Shield / Security Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <h1 class="login-card-title" id="loginTitle">Gate Pass System</h1>
        <p class="login-card-subtitle" id="loginSubtitle">Sign in to access the SEZ portal</p>
      </div>

      <!-- Error Message (hidden by default) -->
      <!-- Firebase Auth: Error messages will be dynamically shown here -->
      <div class="error-message" id="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        <span id="errorText">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <!-- Firebase Auth: Replace form action with Firebase signInWithEmailAndPassword -->
      <form class="login-form" id="loginForm" autocomplete="off">
        <!-- User ID -->
        <div class="form-group">
          <label class="form-label" for="userId">User ID</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" class="form-input" id="userId" placeholder="Enter your User ID" required autocomplete="username" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
            <input type="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <!-- Show/Hide Password Toggle -->
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password">
              <!-- Eye Icon (show) -->
              <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye Off Icon (hide) - hidden by default -->
              <svg id="eyeHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <!-- Forgot Password Link -->
          <div class="forgot-password-wrapper">
            <a href="#" id="forgotPasswordLink" class="forgot-password-link">Forgot Password?</a>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-text">Login</span>
        </button>
      </form>
    </div>
  </main>

  <!-- ============================================================
       PAGE FOOTER
       ============================================================ -->
  <footer class="login-page-footer">
    &copy; 2026 Tata Steel Special Economic Zone Limited. All rights reserved.
  </footer>

  <!-- ============================================================
       FORGOT PASSWORD MODAL
       ============================================================ -->
  <div class="modal-overlay" id="forgotPasswordModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Reset Password</h2>
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Enter your registered email address to receive a password reset link.</p>
        
        <!-- Modal Error/Success Messages -->
        <div class="modal-message" id="modalMessage"></div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label class="form-label" for="resetEmail">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input type="email" class="form-input" id="resetEmail" placeholder="Enter your email" required />
            </div>
          </div>
          <button type="submit" class="btn-login" id="btnResetPassword">
            <span class="btn-text">Send Reset Link</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script type="module" src="login.js"></script>
</body>

</html>
